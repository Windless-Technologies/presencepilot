name: Bug report
description: Something is broken or behaves differently than documented
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve PresencePilot. Please provide as much detail as possible. Security problems go to the address in SECURITY.md instead, not a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, page, or environment (production, a Vercel preview, or local).
  - type: dropdown
    id: browsers
    attributes:
      label: Which browser(s)?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, logs, or trace IDs
      description: Remove any email addresses, tokens or other personal data first.
      render: shell
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks users from a core task
        - Degrades a core task
        - Cosmetic or minor
        - Accessibility barrier
        - Security or privacy concern (report privately instead, see SECURITY.md)
    validations:
      required: true
