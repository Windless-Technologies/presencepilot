name: Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels:
  - feature
  - P2 - Medium
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us grow PresencePilot! Please provide context for your feature request.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who has it, what it costs them today, and how often.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: The outcome
      description: What success looks like, ideally as something measurable. Who benefits and how?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
      description: High-level logic or UI notes. Alternatives considered and their tradeoffs.
  - type: checkboxes
    id: ai
    attributes:
      label: AI
      options:
        - label: This involves an AI model. It will start from a written spec and get evals before launch.
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
