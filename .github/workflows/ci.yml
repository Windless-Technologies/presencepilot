name: CI

# Quality gates on every pull request (engineering standards, section 7):
# standards check, lint, typecheck, tests, build, then the dependency audit.
# The secret scan (secrets.yml) and static analysis (codeql.yml) run as
# their own workflows.
#
# If a step fails for a missing environment variable rather than a real
# defect, add it as a repository secret and reference it here. Do not remove
# the step.

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A filter of `branches: [main]` here means a pull
  # request whose base is another branch runs no checks at all, which is
  # exactly when a stacked change is hardest to verify by eye.
  pull_request:

# Least privilege (standards, supply chain): every job only reads the
# repository unless it declares more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Standards, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check project standards
        # Milliseconds, no dependencies. Runs first so a personal address or a
        # duplicate route tree fails in seconds, not minutes.
        run: node scripts/check-standards.mjs

      - name: Cache Next.js build
        # Restored before installing dependencies, so the source hash in the
        # key covers the repository and not every file in node_modules.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        # Reproducible install from the committed lockfile. No Cypress specs
        # exist yet, so the Cypress binary download is skipped; the npm
        # package itself is still installed and audited.
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Standards, section 5: zero known vulnerabilities. Production
      # dependencies block the merge at --audit-level=low (not high, which
      # lets moderate advisories through indefinitely).
      - name: Production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=low
      # Development dependencies are reported, not blocking. Still fix them.
      - name: All dependencies (report)
        run: npm audit --audit-level=low || echo "::warning::Development dependency advisories found. See the log above."
